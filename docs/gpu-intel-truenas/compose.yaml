# TrueNAS Custom App: beszel-intel-lab. Render placeholders before installing.
services:
  agent:
    image: beszel-intel-lab:${LAB_COMMIT_SHA}
    pull_policy: never
    restart: unless-stopped
    environment:
      GPU_COLLECTOR: intel_sysfs
      HUB_URL: ${LAB_HUB_URL}
      KEY: ${LAB_HUB_PUBLIC_KEY}
      TOKEN: ${LAB_AGENT_TOKEN}
      LISTEN: /var/lib/beszel-agent/lab.sock
      SENSORS: ""
      # Experimental combined image only; defaults remain disabled:
      # INTEL_SYSFS_MODE: suspend-aware
      # INTEL_XE_DEBUGFS_MEMORY: "true"
      # LOG_LEVEL: debug
    volumes:
      - /sys:/sys:ro
      - agent-data:/var/lib/beszel-agent
    # Ordinary private PID namespace, no Docker socket, no render node.
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=16m
volumes:
  agent-data: {}
